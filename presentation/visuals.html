<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Road-Sense Visualizations</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <nav class="top-nav reveal">
    <div class="nav-container">
      <div class="brand">ROAD-SENSE</div>
      <button id="menuToggle" class="menu-toggle" aria-label="Toggle menu">Menu</button>
      <ul id="menu" class="menu">
        <li><a href="index.html">Home</a></li>
        <li><a href="docs.html">Docs</a></li>
        <li><a href="reports.html">Reports</a></li>
        <li><a href="visuals.html" class="active">Visuals</a></li>
        <li><a href="detect.html">Detect</a></li>
        <li><a href="index.html#results">Results</a></li>
        <button id="themeToggle" class="theme-toggle" aria-label="Toggle theme">☀️</button>
      </ul>
    </div>
  </nav>

  <main class="reveal">
    <div class="panel" style="margin-top: 3rem;">
      <div class="panel-head">
        <p class="eyebrow">Model Artifacts</p>
        <h2>Visualizations Gallery</h2>
      </div>
      <div class="visuals-layout">
        <div class="visuals-filter">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="dataset">Dataset Analysis</button>
          <button class="filter-btn" data-filter="runs">Training Runs</button>
          <button class="filter-btn" data-filter="planning">Project Planning</button>
        </div>
        <div id="visualGrid" class="visual-grid"></div>
      </div>
    </div>
  </main>

  <footer class="footer reveal">
    <p>Road-Sense Presentation Site</p>
    <p>Built for docs, reports, visual artifacts, and milestone communication.</p>
  </footer>

  <!-- Full-Screen Image Viewer -->
  <div id="imageViewer" class="image-viewer" aria-hidden="true">
    <div class="image-viewer-inner">
      <div class="image-viewer-header">
        <span id="imageViewerTitle" class="image-viewer-title"></span>
        <button id="imageViewerClose" class="image-viewer-close" type="button" aria-label="Close viewer">Close</button>
      </div>
      <div class="image-viewer-body">
        <img id="imageViewerImage" class="image-viewer-image" src="" alt="Visualization" />
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
