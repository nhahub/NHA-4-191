<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Road-Sense Detection Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; padding: 20px; }
.dashboard { max-width: 1400px; margin: 0 auto; }
h1 { font-size: 28px; margin-bottom: 24px; color: #38bdf8; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 24px; }
.card { background: #1e293b; border-radius: 12px; padding: 20px; border: 1px solid #334155; }
.card h3 { font-size: 14px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
.card .value { font-size: 36px; font-weight: 700; color: #38bdf8; }
.card .value.green { color: #4ade80; }
.card .value.yellow { color: #facc15; }
.chart-container { background: #1e293b; border-radius: 12px; padding: 20px; border: 1px solid #334155; margin-bottom: 20px; }
.chart-container h3 { margin-bottom: 16px; color: #94a3b8; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.meter { display: flex; align-items: center; gap: 12px; margin: 8px 0; }
.meter .label { width: 120px; font-size: 14px; }
.meter .bar { flex: 1; height: 20px; background: #334155; border-radius: 10px; overflow: hidden; }
.meter .bar .fill { height: 100%; border-radius: 10px; transition: width 0.5s; }
</style>
</head>
<body>
<div class="dashboard">
<h1> Road-Sense Detection Dashboard</h1>
<div class="grid">
  <div class="card"><h3>Inference FPS</h3><div class="value green" id="fps">36.4</div></div>
  <div class="card"><h3>mAP@50</h3><div class="value" id="map50">0.935</div></div>
  <div class="card"><h3>mAP@50:95</h3><div class="value" id="map5095">0.725</div></div>
  <div class="card"><h3>RAM Usage</h3><div class="value yellow" id="ram">1.66 GB</div></div>
</div>
<div class="row">
  <div class="chart-container"><h3> Per-Class mAP@50</h3><canvas id="perClassChart"></canvas></div>
  <div class="chart-container"><h3> Accuracy Comparison</h3><canvas id="accuracyChart"></canvas></div>
</div>
<div class="chart-container"><h3> System Performance</h3>
  <div class="meter"><span class="label">Precision</span><div class="bar"><div class="fill" style="width:89.3%;background:#4ade80"></div></div><span>0.893</span></div>
  <div class="meter"><span class="label">Recall</span><div class="bar"><div class="fill" style="width:89.4%;background:#38bdf8"></div></div><span>0.894</span></div>
  <div class="meter"><span class="label">F1 Score</span><div class="bar"><div class="fill" style="width:89.3%;background:#facc15"></div></div><span>0.893</span></div>
  <div class="meter"><span class="label">Model Size</span><div class="bar"><div class="fill" style="width:38.8%;background:#a78bfa"></div></div><span>38.8 MB</span></div>
  <div class="meter"><span class="label">Memory Budget</span><div class="bar"><div class="fill" style="width:83%;background:#4ade80"></div></div><span>1.66/2 GB</span></div>
</div>
</div>
<script>
new Chart(document.getElementById('perClassChart'), {
  type: 'bar', data: {
    labels: ['Vehicle', 'Pedestrian', 'Cyclist'],
    datasets: [{
      label: 'mAP@50', data: [0.979, 0.889, 0.938],
      backgroundColor: ['#4ade80','#38bdf8','#facc15']
    }, {
      label: 'mAP@50:95', data: [0.873, 0.563, 0.740],
      backgroundColor: ['#4ade80','#38bdf8','#facc15'].map(c => c + '66')
    }]
  },
  options: { responsive: true, scales: { y: { beginAtZero: true, max: 1 } },
    plugins: { legend: { labels: { color: '#94a3b8' } } } }
});
new Chart(document.getElementById('accuracyChart'), {
  type: 'radar', data: {
    labels: ['Precision', 'Recall', 'F1', 'mAP@50', 'FPS'],
    datasets: [{
      label: 'YOLO11m HPO', data: [89.3, 89.4, 89.3, 93.5, 36.4],
      borderColor: '#38bdf8', backgroundColor: '#38bdf833'
    }]
  },
  options: { responsive: true, scales: { r: { beginAtZero: true, ticks: { color: '#94a3b8' } } },
    plugins: { legend: { labels: { color: '#94a3b8' } } } }
});
</script>
</body>
</html>
